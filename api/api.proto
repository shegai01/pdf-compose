syntax = "proto3";

package pdf_compose;

option go_package = "service-pdf-compose/api";

message ComposeRequest {
    bytes upfile1 = 1;
    bytes upfile2 = 2;
    bytes upfile3 = 3;
}   
    
message ComposeResponse{
    bytes pdf_file = 1;
}

service PdfComposeService{
    rpc ComposeFromFiles(ComposeRequest) returns (ComposeResponse);
}